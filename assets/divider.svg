<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" preserveAspectRatio="none" role="presentation">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7AA5C7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7AA5C7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7AA5C7" stop-opacity="0"/>
    </linearGradient>
    <filter id="dgGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#dg)" stroke-width="1" filter="url(#dgGlow)"/>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#dg)" stroke-width="0.5"/>
  <circle r="2" fill="#B8D4E8" filter="url(#dgGlow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M 0,12 L 1200,12"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
