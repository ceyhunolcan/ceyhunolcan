<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Visual abstract: Smartphone missingness as a depression biomarker">
  <defs>
    <linearGradient id="vabg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F18"/>
      <stop offset="100%" stop-color="#162033"/>
    </linearGradient>
    <linearGradient id="phqGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0"/>
    </linearGradient>
    <filter id="vaglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#vabg)"/>

  <!-- Title -->
  <text x="60" y="42" font-family="Georgia, 'Iowan Old Style', serif" font-size="18" font-weight="600" fill="#E8ECF0">The gaps <tspan font-style="italic">are</tspan> the signal.</text>
  <text x="60" y="62" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8" letter-spacing="2">SMARTPHONE MISSINGNESS · STUDENTLIFE COHORT · n = 48</text>

