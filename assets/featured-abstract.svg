  <!-- BOTTOM PANEL: PHQ-9 score line -->
  <g transform="translate(60, 220)">
    <text x="-5" y="-8" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#D4A574" letter-spacing="1">PHQ-9</text>
    <!-- baseline -->
    <line x1="0" y1="60" x2="1080" y2="60" stroke="#1E293B" stroke-width="0.5"/>
    <line x1="0" y1="30" x2="1080" y2="30" stroke="#1E293B" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.6"/>
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#1E293B" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.4"/>

    <!-- highlighted gap regions to match top panel -->
    <rect x="178" y="-5" width="92" height="70" fill="#D4A574" opacity="0.08"/>
    <rect x="610" y="-5" width="110" height="70" fill="#D4A574" opacity="0.08"/>

    <!-- area fill under line -->
    <path d="M 0,55 L 50,52 L 100,50 L 150,48 L 180,45 L 200,30 L 220,12 L 240,8 L 260,15 L 270,30 L 300,42 L 350,48 L 400,50 L 450,52 L 500,50 L 550,48 L 600,46 L 612,40 L 640,20 L 670,6 L 700,10 L 720,28 L 760,42 L 800,48 L 850,52 L 900,50 L 950,52 L 1000,54 L 1050,55 L 1080,56 L 1080,60 L 0,60 Z"
          fill="url(#phqGrad)"/>

    <!-- PHQ-9 line -->
    <path d="M 0,55 L 50,52 L 100,50 L 150,48 L 180,45 L 200,30 L 220,12 L 240,8 L 260,15 L 270,30 L 300,42 L 350,48 L 400,50 L 450,52 L 500,50 L 550,48 L 600,46 L 612,40 L 640,20 L 670,6 L 700,10 L 720,28 L 760,42 L 800,48 L 850,52 L 900,50 L 950,52 L 1000,54 L 1050,55 L 1080,56"
          stroke="#D4A574" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#vaglow)"/>

    <!-- peak indicators -->
    <circle cx="240" cy="8" r="3" fill="#B8D4E8" filter="url(#vaglow)"/>
    <circle cx="670" cy="6" r="3" fill="#B8D4E8" filter="url(#vaglow)"/>
  </g>

  <!-- KEY FINDING annotation -->
  <text x="60" y="335" font-family="Georgia, 'Iowan Old Style', serif" font-size="14" fill="#94A3B8" font-style="italic">When phone-use data is sparse — </text>
  <text x="294" y="335" font-family="Georgia, 'Iowan Old Style', serif" font-size="14" font-weight="600" fill="#D4A574">depression scores spike.</text>
  <text x="478" y="335" font-family="Georgia, 'Iowan Old Style', serif" font-size="14" fill="#94A3B8" font-style="italic"> Missingness isn't a nuisance; it's the marker.</text>

  <!-- footer tags -->
  <text x="60" y="360" font-family="ui-monospace, monospace" font-size="8" fill="#475569" letter-spacing="2">VISUAL ABSTRACT · OLCAN 2026 · DOI 10.64898/2026.04.30.26351977</text>
</svg>
