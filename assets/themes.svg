<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Research themes constellation">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F18"/>
      <stop offset="100%" stop-color="#162033"/>
    </linearGradient>
    <radialGradient id="rcenter" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7AA5C7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7AA5C7" stop-opacity="0"/>
    </radialGradient>
    <filter id="rglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#rbg)"/>
  <rect width="1200" height="280" fill="url(#rcenter)"/>

  <!-- Center anchor -->
  <g transform="translate(600, 140)">
    <circle r="6" fill="#B8D4E8" filter="url(#rglow)">
      <animate attributeName="r" values="5;7;5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="32" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8" letter-spacing="3">ONE QUESTION</text>
    <text x="0" y="50" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="13" fill="#CBD5E1" font-style="italic">what does it take to make</text>
    <text x="0" y="68" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="13" fill="#CBD5E1" font-style="italic">behavioral health AI hold up in the real world?</text>
  </g>

  <!-- All connection lines same blue -->
  <g stroke="#7AA5C7" stroke-width="1" fill="none" opacity="0.35">
    <line x1="600" y1="140" x2="220" y2="60">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="140" x2="980" y2="60">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" begin="1.25s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="140" x2="220" y2="220">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" begin="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="140" x2="980" y2="220">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" begin="3.75s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Traveling pulses (all same blue, staggered timing) -->
  <circle r="2.5" fill="#B8D4E8" filter="url(#rglow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 600,140 L 220,60"/>
  </circle>
  <circle r="2.5" fill="#B8D4E8" filter="url(#rglow)">
    <animateMotion dur="5s" begin="1.25s" repeatCount="indefinite" path="M 600,140 L 980,60"/>
  </circle>
  <circle r="2.5" fill="#B8D4E8" filter="url(#rglow)">
    <animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" path="M 600,140 L 220,220"/>
  </circle>
  <circle r="2.5" fill="#B8D4E8" filter="url(#rglow)">
    <animateMotion dur="5s" begin="3.75s" repeatCount="indefinite" path="M 600,140 L 980,220"/>
  </circle>

  <!-- Quadrant 1: Foundation Models (top-left) -->
  <g transform="translate(220, 60)">
    <circle r="5" fill="#7AA5C7" filter="url(#rglow)">
      <animate attributeName="r" values="4;5.5;4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-18" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#7AA5C7" letter-spacing="2">01</text>
    <text x="0" y="22" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="15" font-weight="600" fill="#E8ECF0">Foundation Models</text>
    <text x="0" y="40" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="11" fill="#94A3B8" font-style="italic">Self-supervised pretraining over</text>
    <text x="0" y="54" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="11" fill="#94A3B8" font-style="italic">multimodal sensor streams</text>
  </g>

  <!-- Quadrant 2: Reliability & Auditing (top-right) -->
  <g transform="translate(980, 60)">
    <circle r="5" fill="#7AA5C7" filter="url(#rglow)">
      <animate attributeName="r" values="4;5.5;4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-18" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#7AA5C7" letter-spacing="2">02</text>
    <text x="0" y="22" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="15" font-weight="600" fill="#E8ECF0">Reliability &amp; Auditing</text>
    <text x="0" y="40" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="11" fill="#94A3B8" font-style="italic">Drift, missingness, fairness —</text>
    <text x="0" y="54" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="11" fill="#94A3B8" font-style="italic">propagated downstream</text>
  </g>

  <!-- Quadrant 3: Computational Psychiatry (bottom-left) -->
  <g transform="translate(220, 220)">
    <circle r="5" fill="#7AA5C7" filter="url(#rglow)">
      <animate attributeName="r" values="4;5.5;4" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-18" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#7AA5C7" letter-spacing="2">03</text>
    <text x="0" y="22" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="15" font-weight="600" fill="#E8ECF0">Computational Psychiatry</text>
    <text x="0" y="40" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="11" fill="#94A3B8" font-style="italic">Passive sensing for depression</text>
    <text x="0" y="54" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="11" fill="#94A3B8" font-style="italic">under adherence drift</text>
  </g>

  <!-- Quadrant 4: Climate–Health Systems (bottom-right) -->
  <g transform="translate(980, 220)">
    <circle r="5" fill="#7AA5C7" filter="url(#rglow)">
      <animate attributeName="r" values="4;5.5;4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-18" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#7AA5C7" letter-spacing="2">04</text>
    <text x="0" y="22" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="15" font-weight="600" fill="#E8ECF0">Climate–Health Systems</text>
    <text x="0" y="40" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="11" fill="#94A3B8" font-style="italic">Environmental confounding —</text>
    <text x="0" y="54" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="11" fill="#94A3B8" font-style="italic">climate as structure, not noise</text>
  </g>
</svg>
