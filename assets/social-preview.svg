<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Ceyhun Olcan — Biomedical AI · Dartmouth">
  <defs>
    <linearGradient id="spbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1422"/>
      <stop offset="100%" stop-color="#162033"/>
    </linearGradient>
    <radialGradient id="spGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#7AA5C7" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#7AA5C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spName" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7AA5C7"/>
      <stop offset="50%" stop-color="#B8D4E8"/>
      <stop offset="100%" stop-color="#7AA5C7"/>
    </linearGradient>
    <linearGradient id="spAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7AA5C7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7AA5C7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7AA5C7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#spbg)"/>
  <rect width="1280" height="640" fill="url(#spGlow)"/>

  <!-- Top & bottom accent lines -->
  <rect x="0" y="0" width="1280" height="2" fill="url(#spAccent)"/>
  <rect x="0" y="638" width="1280" height="2" fill="url(#spAccent)"/>

  <!-- Subtle constellation, left side -->
  <g transform="translate(220, 320)" opacity="0.5">
    <g stroke="#4A6FA5" stroke-width="0.6" opacity="0.5">
      <line x1="-40" y1="-120" x2="60" y2="-70"/>
      <line x1="60" y1="-70" x2="140" y2="-100"/>
      <line x1="60" y1="-70" x2="140" y2="-20"/>
      <line x1="-40" y1="-120" x2="-70" y2="-40"/>
      <line x1="-70" y1="-40" x2="60" y2="-70"/>
      <line x1="-70" y1="-40" x2="30" y2="40"/>
      <line x1="30" y1="40" x2="140" y2="-20"/>
      <line x1="140" y1="-100" x2="140" y2="-20"/>
      <line x1="30" y1="40" x2="110" y2="80"/>
      <line x1="110" y1="80" x2="140" y2="-20"/>
      <line x1="-70" y1="-40" x2="-100" y2="60"/>
      <line x1="-100" y1="60" x2="30" y2="40"/>
    </g>
    <g>
      <circle cx="-40" cy="-120" r="4" fill="#7AA5C7"/>
      <circle cx="60" cy="-70" r="4" fill="#7AA5C7"/>
      <circle cx="140" cy="-100" r="4" fill="#B8D4E8"/>
      <circle cx="140" cy="-20" r="4" fill="#7AA5C7"/>
      <circle cx="-70" cy="-40" r="4" fill="#7AA5C7"/>
      <circle cx="30" cy="40" r="4" fill="#B8D4E8"/>
      <circle cx="-100" cy="60" r="4" fill="#7AA5C7"/>
      <circle cx="110" cy="80" r="4" fill="#7AA5C7"/>
    </g>
  </g>

  <!-- ECG waveform, right side -->
  <g transform="translate(1080, 320)" opacity="0.55">
    <line x1="-80" y1="0" x2="120" y2="0" stroke="#1E293B" stroke-width="0.5"/>
    <path d="M -80,0 L -40,0 L -30,-6 L -20,6 L -10,0 L 0,0 L 8,-30 L 14,52 L 20,-16 L 26,0 L 60,0 L 68,-4 L 74,4 L 80,0 L 120,0"
          stroke="#7AA5C7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- CENTER: Name + tagline -->
  <text x="640" y="290" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="100" font-weight="600" fill="url(#spName)" letter-spacing="-1">Ceyhun Olcan</text>

  <text x="640" y="335" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="18" fill="#94A3B8" letter-spacing="9">BIOMEDICAL · DIGITAL HEALTH · DARTMOUTH</text>

  <text x="640" y="395" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="24" fill="#CBD5E1" font-style="italic">Building reliable, fairness-audited AI</text>
  <text x="640" y="430" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="24" fill="#CBD5E1" font-style="italic">for behavioral health.</text>

  <!-- Identity tag pills -->
  <g transform="translate(640, 500)">
    <!-- Pill 1: Foundation Models -->
    <g transform="translate(-310, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="none" stroke="#7AA5C7" stroke-width="1"/>
      <text x="0" y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#7AA5C7" letter-spacing="2">FOUNDATION MODELS</text>
    </g>
    <!-- Pill 2: Passive Sensing -->
    <g transform="translate(-100, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="none" stroke="#D4A574" stroke-width="1"/>
      <text x="0" y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#D4A574" letter-spacing="2">PASSIVE SENSING</text>
    </g>
    <!-- Pill 3: Climate-Health -->
    <g transform="translate(110, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="none" stroke="#88B5A8" stroke-width="1"/>
      <text x="0" y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#88B5A8" letter-spacing="2">CLIMATE–HEALTH</text>
    </g>
    <!-- Pill 4: Reliability -->
    <g transform="translate(295, 0)">
      <rect x="-75" y="-18" width="150" height="36" rx="18" fill="none" stroke="#A78BBA" stroke-width="1"/>
      <text x="0" y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#A78BBA" letter-spacing="2">RELIABILITY</text>
    </g>
  </g>

  <!-- Footer tags -->
  <text x="60" y="600" font-family="ui-monospace, monospace" font-size="12" fill="#64748B" letter-spacing="2">// HANOVER, NH · DARTMOUTH COLLEGE</text>
  <text x="1220" y="600" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" fill="#64748B" letter-spacing="2">GITHUB.COM/CEYHUNOLCAN //</text>
</svg>
