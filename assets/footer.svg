<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Open to research collaborations">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F1A26"/>
      <stop offset="50%" stop-color="#10131F"/>
      <stop offset="100%" stop-color="#06080F"/>
    </linearGradient>
    <linearGradient id="fAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C97064" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D4A574" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#88B5A8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4A574">
        <animate attributeName="stop-color" values="#D4A574;#88B5A8;#D4A574" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#88B5A8">
        <animate attributeName="stop-color" values="#88B5A8;#D4A574;#88B5A8" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="180" fill="url(#fbg)"/>

  <rect x="0" y="0" width="1200" height="1" fill="url(#fAccent)">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated wave paths -->
  <path d="M 0,90 Q 150,60 300,90 T 600,90 T 900,90 T 1200,90" stroke="#88B5A8" stroke-width="1" fill="none" opacity="0.35">
    <animate attributeName="d"
             values="M 0,90 Q 150,60 300,90 T 600,90 T 900,90 T 1200,90;
                     M 0,90 Q 150,120 300,90 T 600,90 T 900,90 T 1200,90;
                     M 0,90 Q 150,60 300,90 T 600,90 T 900,90 T 1200,90"
             dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M 0,95 Q 150,65 300,95 T 600,95 T 900,95 T 1200,95" stroke="#D4A574" stroke-width="1" fill="none" opacity="0.3">
    <animate attributeName="d"
             values="M 0,95 Q 150,125 300,95 T 600,95 T 900,95 T 1200,95;
                     M 0,95 Q 150,65 300,95 T 600,95 T 900,95 T 1200,95;
                     M 0,95 Q 150,125 300,95 T 600,95 T 900,95 T 1200,95"
             dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- Floating particles -->
  <g opacity="0.5">
    <circle cx="100" cy="40" r="1" fill="#88B5A8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="50" r="1.2" fill="#C97064">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="140" r="1" fill="#D4A574">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="135" r="1" fill="#88B5A8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main headline (serif) -->
  <text x="600" y="62" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="28" font-weight="700" fill="url(#fText)" letter-spacing="-0.3" font-style="italic">Open to research collaborations</text>

  <!-- Sub-line -->
  <text x="600" y="135" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="13" fill="#CBD5E1" font-style="italic">foundation models · passive sensing reliability · climate–health · wearable auditing</text>

  <!-- Decorative dots -->
  <g transform="translate(600, 158)">
    <circle cx="-14" cy="0" r="2" fill="#D4A574">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2" fill="#88B5A8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="14" cy="0" r="2" fill="#C97064">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="40" y="170" font-family="ui-monospace, monospace" font-size="9" fill="#64748B" letter-spacing="2">// HANOVER, NH</text>
  <text x="1160" y="170" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#64748B" letter-spacing="2">EST. 2026 //</text>
</svg>
