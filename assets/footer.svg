<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Open to research collaborations">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#162033"/>
      <stop offset="50%" stop-color="#0D1422"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="fAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7AA5C7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7AA5C7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7AA5C7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7AA5C7">
        <animate attributeName="stop-color" values="#7AA5C7;#B8D4E8;#7AA5C7" dur="15s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#B8D4E8">
        <animate attributeName="stop-color" values="#B8D4E8;#7AA5C7;#B8D4E8" dur="15s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="180" fill="url(#fbg)"/>

  <rect x="0" y="0" width="1200" height="1" fill="url(#fAccent)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Single wave path -->
  <path d="M 0,90 Q 150,60 300,90 T 600,90 T 900,90 T 1200,90" stroke="#7AA5C7" stroke-width="1" fill="none" opacity="0.3">
    <animate attributeName="d"
             values="M 0,90 Q 150,60 300,90 T 600,90 T 900,90 T 1200,90;
                     M 0,90 Q 150,120 300,90 T 600,90 T 900,90 T 1200,90;
                     M 0,90 Q 150,60 300,90 T 600,90 T 900,90 T 1200,90"
             dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Subtle particles -->
  <g opacity="0.5">
    <circle cx="100" cy="40" r="1" fill="#7AA5C7">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="50" r="1.2" fill="#B8D4E8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="140" r="1" fill="#7AA5C7">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="135" r="1" fill="#B8D4E8">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main headline -->
  <text x="600" y="62" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="28" font-weight="600" fill="url(#fText)" letter-spacing="-0.3" font-style="italic">Open to research collaborations</text>

  <!-- Sub-line -->
  <text x="600" y="135" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', serif" font-size="13" fill="#CBD5E1" font-style="italic">foundation models · passive sensing reliability · climate–health · wearable auditing</text>

  <!-- Three accent dots (same blue) -->
  <g transform="translate(600, 158)">
    <circle cx="-14" cy="0" r="2" fill="#7AA5C7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2" fill="#7AA5C7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="14" cy="0" r="2" fill="#7AA5C7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="40" y="170" font-family="ui-monospace, monospace" font-size="9" fill="#64748B" letter-spacing="2">// HANOVER, NH</text>
  <text x="1160" y="170" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#64748B" letter-spacing="2">EST. 2026 //</text>
</svg>
