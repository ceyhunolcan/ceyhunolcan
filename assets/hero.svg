<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Ceyhun Olcan — Biomedical · Digital Health · Dartmouth">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1422"/>
      <stop offset="100%" stop-color="#162033"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#7AA5C7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7AA5C7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7AA5C7">
        <animate attributeName="stop-color" values="#7AA5C7;#B8D4E8;#7AA5C7" dur="15s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#B8D4E8">
        <animate attributeName="stop-color" values="#B8D4E8;#7AA5C7;#B8D4E8" dur="15s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7AA5C7">
        <animate attributeName="stop-color" values="#7AA5C7;#B8D4E8;#7AA5C7" dur="15s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7AA5C7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7AA5C7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7AA5C7" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#bgGlow)"/>

  <rect x="0" y="0" width="1200" height="1" fill="url(#accent)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="319" width="1200" height="1" fill="url(#accent)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Reduced particle set: 4 instead of 8, all same hue -->
  <g opacity="0.5">
    <circle cx="110" cy="50" r="1" fill="#7AA5C7">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="80" r="1.2" fill="#B8D4E8">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="265" r="1" fill="#7AA5C7">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="240" r="1" fill="#B8D4E8">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- LEFT: Neural network constellation (monochromatic blue) -->
  <g transform="translate(140, 160)">
    <g stroke="#4A6FA5" stroke-width="0.5" opacity="0.3">
      <line x1="-20" y1="-60" x2="40" y2="-30"/>
      <line x1="40" y1="-30" x2="100" y2="-50"/>
      <line x1="40" y1="-30" x2="100" y2="10"/>
      <line x1="-20" y1="-60" x2="-40" y2="0"/>
      <line x1="-40" y1="0" x2="40" y2="-30"/>
      <line x1="-40" y1="0" x2="20" y2="40"/>
      <line x1="20" y1="40" x2="100" y2="10"/>
      <line x1="100" y1="-50" x2="100" y2="10"/>
      <line x1="20" y1="40" x2="80" y2="70"/>
      <line x1="80" y1="70" x2="100" y2="10"/>
      <line x1="-40" y1="0" x2="-60" y2="60"/>
      <line x1="-60" y1="60" x2="20" y2="40"/>
    </g>
    <g filter="url(#glow)">
      <circle cx="-20" cy="-60" r="3" fill="#7AA5C7">
        <animate attributeName="r" values="2.5;4;2.5" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="-30" r="3" fill="#7AA5C7">
        <animate attributeName="r" values="2.5;4;2.5" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="-50" r="3" fill="#B8D4E8">
        <animate attributeName="r" values="2.5;4;2.5" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="10" r="3" fill="#7AA5C7">
        <animate attributeName="r" values="2.5;4;2.5" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-40" cy="0" r="3" fill="#7AA5C7">
        <animate attributeName="r" values="2.5;4;2.5" dur="4.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="40" r="3" fill="#B8D4E8">
        <animate attributeName="r" values="2.5;4;2.5" dur="4.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-60" cy="60" r="3" fill="#7AA5C7">
        <animate attributeName="r" values="2.5;4;2.5" dur="4.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="80" cy="70" r="3" fill="#7AA5C7">
        <animate attributeName="r" values="2.5;4;2.5" dur="4.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- CENTER: Name + subtitle + tagline -->
  <text x="600" y="142" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="60" font-weight="600" fill="url(#nameGrad)" letter-spacing="-0.5">Ceyhun Olcan</text>

  <text x="600" y="172" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" letter-spacing="6">BIOMEDICAL · DIGITAL HEALTH · DARTMOUTH</text>

  <text x="600" y="208" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="14" fill="#CBD5E1" font-style="italic">Building reliable, fairness-audited AI for behavioral health.</text>

  <!-- Three accent dots (same blue, varying timing) -->
  <g transform="translate(600, 232)">
    <circle cx="-12" cy="0" r="2.5" fill="#7AA5C7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2.5" fill="#7AA5C7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="12" cy="0" r="2.5" fill="#7AA5C7">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- RIGHT: ECG waveform -->
  <g transform="translate(990, 165)">
    <g stroke="#1E293B" stroke-width="0.5" opacity="0.5">
      <line x1="-50" y1="0" x2="170" y2="0"/>
      <line x1="-50" y1="-32" x2="170" y2="-32" stroke-dasharray="2,3"/>
      <line x1="-50" y1="32" x2="170" y2="32" stroke-dasharray="2,3"/>
    </g>
    <path d="M -50,0 L -20,0 L -15,-4 L -10,4 L -5,0 L 5,0 L 10,-22 L 14,38 L 18,-12 L 22,0 L 50,0 L 55,-3 L 60,3 L 65,0 L 80,0 L 85,-22 L 89,38 L 93,-12 L 97,0 L 130,0 L 135,-3 L 140,3 L 145,0 L 170,0"
          stroke="#7AA5C7" stroke-width="1.6" fill="none" filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="600" stroke-dashoffset="600">
      <animate attributeName="stroke-dashoffset" values="600;0;0;-600" keyTimes="0;0.45;0.55;1" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle r="3" fill="#B8D4E8" filter="url(#glow)">
      <animateMotion dur="5s" repeatCount="indefinite" path="M -50,0 L -20,0 L -15,-4 L -10,4 L -5,0 L 5,0 L 10,-22 L 14,38 L 18,-12 L 22,0 L 50,0 L 55,-3 L 60,3 L 65,0 L 80,0 L 85,-22 L 89,38 L 93,-12 L 97,0 L 130,0 L 135,-3 L 140,3 L 145,0 L 170,0"/>
    </circle>
    <text x="60" y="-50" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#64748B" letter-spacing="2">LONGITUDINAL · BEHAVIORAL</text>
  </g>

  <text x="40" y="295" font-family="ui-monospace, monospace" font-size="9" fill="#64748B" letter-spacing="2">// PASSIVE_SENSING.RELIABILITY.AUDIT</text>
  <text x="1160" y="295" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#64748B" letter-spacing="2">FOUNDATION_MODEL.v0 //</text>
</svg>
