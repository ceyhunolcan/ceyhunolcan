<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Ceyhun Olcan — Biomedical · Digital Health · Dartmouth">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06081c"/>
      <stop offset="45%" stop-color="#10122f"/>
      <stop offset="100%" stop-color="#2a154a"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Animated gradient for the name -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#8b5cf6;#ec4899;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ec4899;#22d3ee;#8b5cf6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#22d3ee;#8b5cf6;#ec4899" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Top/bottom accent gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#bgGlow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="1.5" fill="url(#accent)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Bottom accent line -->
  <rect x="0" y="318.5" width="1200" height="1.5" fill="url(#accent)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating background particles -->
  <g opacity="0.55">
    <circle cx="110" cy="50" r="1" fill="#22d3ee">
      <animate attributeName="cy" values="50;40;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="80" r="1.2" fill="#ec4899">
      <animate attributeName="cy" values="80;70;80" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="265" r="1" fill="#8b5cf6">
      <animate attributeName="cy" values="265;255;265" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="240" r="1" fill="#22d3ee">
      <animate attributeName="cy" values="240;230;240" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="40" r="0.8" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="275" r="0.9" fill="#ec4899">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="200" r="0.8" fill="#22d3ee">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="180" r="0.8" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- LEFT: Neural network constellation -->
  <g transform="translate(140, 160)">
    <!-- Connections -->
    <g stroke="#22d3ee" stroke-width="0.6" opacity="0.35">
      <line x1="-20" y1="-60" x2="40" y2="-30">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
      </line>
      <line x1="40" y1="-30" x2="100" y2="-50"/>
      <line x1="40" y1="-30" x2="100" y2="10"/>
      <line x1="-20" y1="-60" x2="-40" y2="0"/>
      <line x1="-40" y1="0" x2="40" y2="-30"/>
      <line x1="-40" y1="0" x2="20" y2="40"/>
      <line x1="20" y1="40" x2="100" y2="10">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.5s" repeatCount="indefinite"/>
      </line>
      <line x1="100" y1="-50" x2="100" y2="10"/>
      <line x1="20" y1="40" x2="80" y2="70"/>
      <line x1="80" y1="70" x2="100" y2="10"/>
      <line x1="-40" y1="0" x2="-60" y2="60"/>
      <line x1="-60" y1="60" x2="20" y2="40"/>
    </g>
    <!-- Nodes -->
    <g filter="url(#glow)">
      <circle cx="-20" cy="-60" r="3.5" fill="#22d3ee">
        <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="-30" r="3.5" fill="#8b5cf6">
        <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="-50" r="3.5" fill="#22d3ee">
        <animate attributeName="r" values="3;5;3" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="10" r="3.5" fill="#ec4899">
        <animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-40" cy="0" r="3.5" fill="#8b5cf6">
        <animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="40" r="3.5" fill="#ec4899">
        <animate attributeName="r" values="3;5;3" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-60" cy="60" r="3.5" fill="#22d3ee">
        <animate attributeName="r" values="3;5;3" dur="3.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="80" cy="70" r="3.5" fill="#8b5cf6">
        <animate attributeName="r" values="3;5;3" dur="2.9s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- CENTER: Name + subtitle + tagline -->
  <text x="600" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="url(#nameGrad)" letter-spacing="-1.5" filter="url(#softGlow)">CEYHUN OLCAN</text>

  <text x="600" y="172" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" letter-spacing="6">BIOMEDICAL · DIGITAL HEALTH · DARTMOUTH</text>

  <text x="600" y="208" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1" font-style="italic">Building reliable, fairness-audited AI for behavioral health.</text>

  <!-- Three small accent dots under tagline -->
  <g transform="translate(600, 232)">
    <circle cx="-12" cy="0" r="2.5" fill="#22d3ee">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="2.5" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="12" cy="0" r="2.5" fill="#ec4899">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- RIGHT: ECG waveform with traveling pulse -->
  <g transform="translate(990, 165)">
    <!-- Baseline grid -->
    <g stroke="#1e293b" stroke-width="0.5" opacity="0.6">
      <line x1="-50" y1="0" x2="170" y2="0"/>
      <line x1="-50" y1="-32" x2="170" y2="-32" stroke-dasharray="2,3"/>
      <line x1="-50" y1="32" x2="170" y2="32" stroke-dasharray="2,3"/>
    </g>

    <!-- ECG path (two QRS complexes) -->
    <path d="M -50,0 L -20,0 L -15,-4 L -10,4 L -5,0 L 5,0 L 10,-22 L 14,38 L 18,-12 L 22,0 L 50,0 L 55,-3 L 60,3 L 65,0 L 80,0 L 85,-22 L 89,38 L 93,-12 L 97,0 L 130,0 L 135,-3 L 140,3 L 145,0 L 170,0"
          stroke="#22d3ee" stroke-width="1.8" fill="none" filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="600" stroke-dashoffset="600">
      <animate attributeName="stroke-dashoffset" values="600;0;0;-600" keyTimes="0;0.45;0.55;1" dur="4.5s" repeatCount="indefinite"/>
    </path>

    <!-- Pulse dot riding the waveform -->
    <circle r="3" fill="#ec4899" filter="url(#glow)">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M -50,0 L -20,0 L -15,-4 L -10,4 L -5,0 L 5,0 L 10,-22 L 14,38 L 18,-12 L 22,0 L 50,0 L 55,-3 L 60,3 L 65,0 L 80,0 L 85,-22 L 89,38 L 93,-12 L 97,0 L 130,0 L 135,-3 L 140,3 L 145,0 L 170,0"/>
    </circle>

    <!-- ECG label -->
    <text x="60" y="-50" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#475569" letter-spacing="2">LONGITUDINAL · BEHAVIORAL</text>
  </g>

  <!-- Bottom-left small tag -->
  <text x="40" y="295" font-family="ui-monospace, monospace" font-size="9" fill="#475569" letter-spacing="2">// PASSIVE_SENSING.RELIABILITY.AUDIT</text>
  <!-- Bottom-right small tag -->
  <text x="1160" y="295" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#475569" letter-spacing="2">FOUNDATION_MODEL.v0 //</text>
</svg>
